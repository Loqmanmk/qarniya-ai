# Intégration continue : à chaque push, GitHub vérifie le style, les types et les tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer (PyTorch CPU, plus léger pour la CI)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check . && ruff format --check .

      - name: Types (mypy)
        run: mypy

      - name: Tests + couverture
        run: pytest --cov --cov-report=term-missing
