# Intégration continue : à chaque push, GitHub vérifie style, sécurité, types, tests et dépendances.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Moindre privilège : la CI peut seulement LIRE le dépôt (elle ne peut rien modifier ni publier).
permissions:
  contents: read

# Un nouveau push annule la vérification précédente encore en cours.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions épinglées par empreinte (SHA) : un tag peut être déplacé par un attaquant, pas un SHA.
      # Dependabot les met à jour automatiquement (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer (même PyTorch que sur le PC, version CPU plus légère)
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1"
          pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,serve]"

      - name: Lint + sécurité du code (ruff, règles Bandit incluses)
        run: ruff check . && ruff format --check .

      - name: Types (mypy)
        run: mypy

      - name: Tests + couverture
        run: pytest --cov --cov-report=term-missing

      - name: Vulnérabilités connues des dépendances (pip-audit)
        # PyTorch (+cpu) n'est pas sur PyPI : il est audité à part, voir SECURITY.md
        run: pip-audit --skip-editable
