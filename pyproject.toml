[build-system]
requires = ["setuptools>=84.1"]  # versions antérieures : vulnérabilités connues
build-backend = "setuptools.build_meta"

[project]
name = "qarniya"
version = "0.1.0"
description = "Aide au dépistage précoce du kératocône à partir des cartes de topographie cornéenne."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Équipe NeuroLens" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pillow>=10.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python>=4.8",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "tensorboard>=2.15",
    "typer>=0.12",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
# Outils de qualité en version EXACTE : votre PC, pre-commit et la CI vérifient la même chose.
# (Les mettre à jour volontairement, ensemble, quand Dependabot le propose.)
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pip-audit==2.10.1",
    "types-PyYAML==6.0.12.20261113",
]

[project.scripts]
qarniya = "qarniya.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qarniya.api" = ["static/*"]  # l'interface web est livrée avec le paquet

# ---------- Qualité du code ----------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["prototype"]

[tool.ruff.lint]
# E/W : style PEP 8 · F : erreurs (imports inutilisés…) · I : tri des imports · B : bugs probables
# UP : syntaxe moderne · N : nommage · SIM : simplifications · C4 : compréhensions · RUF : ruff
# S : SÉCURITÉ (règles Bandit : secrets en dur, eval, pickle, subprocess, SQL…)
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "S"]
ignore = ["RUF001", "RUF002", "RUF003"]  # autorise les accents français dans textes et commentaires

[tool.ruff.lint.per-file-ignores]
# S101 : `assert` est l'outil normal des tests (interdit seulement dans le code de l'application)
"tests/**" = ["B011", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "src"
packages = ["qarniya"]
ignore_missing_imports = true   # torch, cv2, sklearn… n'ont pas tous des types complets

# Le hook pre-commit tourne sans PyTorch : torch y devient « Any ». On autorise alors à hériter de
# nn.Module / Dataset et les décorateurs torch, UNIQUEMENT dans les modules qui utilisent PyTorch.
# (En CI et en local, PyTorch est installé et ces lignes ne changent rien.)
[[tool.mypy.overrides]]
module = ["qarniya.models.*", "qarniya.training.*", "qarniya.explainability.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_calls = false  # ex. torch.enable_grad(), non typé dans PyTorch 2.6

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests plus lents qui combinent plusieurs couches",
    "gpu: tests qui nécessitent un GPU",
]

[tool.coverage.run]
source = ["qarniya"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
